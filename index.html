<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body class="pane-list">

  <!-- ログイン画面 -->
  <div id="login-screen" class="login-screen">
    <div class="login-box">
      <h1>ブックマーク管理</h1>
      <p class="login-sub">ログインしてください</p>
      <input type="email" id="login-email" placeholder="メールアドレス">
      <input type="password" id="login-password" placeholder="パスワード">
      <button id="login-btn">ログイン</button>
      <p id="login-error" class="login-error"></p>
    </div>
  </div>

  <!-- メインアプリ画面 -->
  <div id="app" class="app hidden">
    <!-- サイドバー -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="brand">ブックマーク</span>
        <div class="sidebar-header-actions">
          <button id="mode-toggle-btn-tree" class="text-btn mode-toggle-btn">編集</button>
          <button id="settings-btn-tree" class="icon-btn" title="設定">⚙️</button>
        </div>
      </div>
      <div class="tree-actions edit-only">
        <button id="new-root-folder-btn" class="text-btn primary" style="width: 100%;">＋ フォルダ追加</button>
      </div>
      <div id="tree" class="tree"></div>
    </aside>

    <!-- メインエリア -->
    <main class="main">
      <header class="toolbar">
        <button id="mobile-back-btn" class="icon-btn mobile-only" title="戻る">◀</button>
        <div id="breadcrumb" class="breadcrumb"></div>
        <input type="text" id="search-input" class="search-input" placeholder="検索 (タイトル・URL・タグ)">
        <div class="toolbar-actions">
          <button id="add-bookmark-btn" class="text-btn primary edit-only">＋ ブックマーク</button>
          <button id="mode-toggle-btn" class="text-btn mode-toggle-btn">編集</button>
          <button id="settings-btn" class="icon-btn" title="設定">⚙️</button>
        </div>
      </header>
      <div id="list" class="list"></div>
    </main>
  </div>

  <!-- 設定パネル＋背景オーバーレイ -->
  <div id="settings-overlay" class="modal-overlay hidden">
    <div id="settings-panel" class="settings-panel">
      <div class="settings-section">
        <h3>表示設定</h3>
        <label>
          文字サイズ: <span id="font-size-value">15px</span>
          <input type="range" id="font-size-range" min="12" max="22" value="15">
        </label>
        <label>
          行間: <span id="line-height-value">1.6</span>
          <input type="range" id="line-height-range" min="80" max="220" value="160">
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="dark-mode-toggle"> ダークモード
        </label>
      </div>

      <div class="settings-section">
        <h3>データ</h3>
        <button id="import-btn" class="text-btn">HTMLインポート</button>
        <input type="file" id="import-file" accept=".html" class="hidden">
        <button id="export-btn" class="text-btn">HTMLエクスポート</button>
      </div>

      <div class="settings-section">
        <h3>アカウント</h3>
        <button id="logout-btn" class="text-btn danger">ログアウト</button>
      </div>

      <div style="font-size: 11px; color: var(--text-dim); margin-top: 10px;">
        <div id="version-label"></div>
        <div id="debug-info"></div>
      </div>
      <button id="settings-close-btn" class="text-btn" style="margin-top: 10px;">閉じる</button>
    </div>
  </div>

  <!-- 追加・編集用モーダルダイアログ -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-box">
      <h2 id="edit-modal-title">編集</h2>
      <input type="hidden" id="edit-id">
      <input type="hidden" id="edit-type">
      
      <label>
        タイトル
        <input type="text" id="edit-title" placeholder="タイトル">
      </label>
      <label id="edit-url-row">
        URL
        <input type="url" id="edit-url" placeholder="https://example.com">
      </label>
      <label>
        タグ (カンマ区切り)
        <input type="text" id="edit-tags" placeholder="news, tech">
      </label>
      <label>
        メモ
        <textarea id="edit-memo" rows="3" placeholder="メモ"></textarea>
      </label>

      <div class="modal-actions">
        <button id="edit-cancel-btn" class="text-btn">キャンセル</button>
        <button id="edit-save-btn" class="text-btn primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js?v=24"></script>
</body>
</html>
