<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bookmark Manager</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
</head>
<body>

  <!-- ログイン画面 -->
  <div id="login-screen" class="container">
    <div class="card" style="max-width: 400px; margin: 60px auto;">
      <h2>ブックマーク管理 ログイン</h2>
      <div class="form-group">
        <label>メールアドレス</label>
        <input type="email" id="login-email" placeholder="example@email.com">
      </div>
      <div class="form-group">
        <label>パスワード</label>
        <input type="password" id="login-password" placeholder="••••••••">
      </div>
      <button id="login-btn" class="btn btn-primary btn-block">ログイン</button>
      <div id="login-error" class="error-msg" style="color:red; margin-top:10px;"></div>
    </div>
  </div>

  <!-- メインアプリ画面 -->
  <div id="app" class="hidden">
    <header class="app-header">
      <div class="header-left">
        <button id="mobile-back-btn" class="btn btn-icon" title="戻る">◀</button>
        <h1 class="app-title">ブックマーク</h1>
      </div>
      <div class="header-right">
        <button id="mode-toggle-btn" class="btn mode-toggle-btn">編集</button>
        <button id="settings-btn" class="btn btn-icon" title="設定">⚙️</button>
      </div>
    </header>

    <nav id="breadcrumb" class="breadcrumb"></nav>

    <div class="action-bar edit-only">
      <button id="new-root-folder-btn" class="btn btn-secondary">＋ フォルダ追加</button>
      <button id="add-bookmark-btn" class="btn btn-primary">＋ ブックマーク追加</button>
    </div>

    <main id="list" class="item-list"></main>
  </div>

  <!-- 設定パネル＋背景オーバーレイ -->
  <div id="settings-overlay" class="modal-overlay hidden">
    <div id="settings-panel" class="settings-panel">
      <h3>設定 / 検索</h3>

      <div class="setting-item">
        <label>ブックマーク検索</label>
        <input type="text" id="search-input" placeholder="タイトル・URL・タグ">
      </div>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">

      <div class="setting-item">
        <label>文字サイズ: <span id="font-size-value">15px</span></label>
        <input type="range" id="font-size-range" min="12" max="22" value="15">
      </div>
      <div class="setting-item">
        <label>行間: <span id="line-height-value">1.6</span></label>
        <input type="range" id="line-height-range" min="80" max="220" value="160">
      </div>
      <div class="setting-item">
        <label>
          <input type="checkbox" id="dark-mode-toggle"> ダークモード
        </label>
      </div>

      <hr style="margin: 20px 0; border: none; border-top: 1px solid var(--border-color);">

      <div class="setting-item">
        <button id="import-btn" class="btn btn-block" style="margin-bottom: 10px;">HTMLインポート</button>
        <input type="file" id="import-file" accept=".html" class="hidden">
        <button id="export-btn" class="btn btn-block">HTMLエクスポート</button>
      </div>
      <div class="setting-item">
        <button id="logout-btn" class="btn btn-block" style="background-color: #e63946; color: white;">ログアウト</button>
      </div>
      <div style="font-size: 11px; color: var(--sub-text-color); margin-top: 20px;">
        <div id="version-label"></div>
        <div id="debug-info"></div>
      </div>
      <button id="settings-close-btn" class="btn btn-block" style="margin-top: 20px;">閉じる</button>
    </div>
  </div>

  <!-- 追加・編集用モーダルダイアログ -->
  <div id="edit-modal" class="modal-overlay hidden">
    <div class="modal-card">
      <h3 id="edit-modal-title">編集</h3>
      <input type="hidden" id="edit-id">
      <input type="hidden" id="edit-type">
      
      <div class="form-group">
        <label>タイトル</label>
        <input type="text" id="edit-title" placeholder="タイトルを入力">
      </div>
      <div class="form-group" id="edit-url-row">
        <label>URL</label>
        <input type="url" id="edit-url" placeholder="https://example.com">
      </div>
      <div class="form-group">
        <label>タグ (カンマ区切り)</label>
        <input type="text" id="edit-tags" placeholder="news, tech">
      </div>
      <div class="form-group">
        <label>メモ</label>
        <textarea id="edit-memo" rows="3" placeholder="メモを残せます"></textarea>
      </div>

      <div class="modal-actions" style="display:flex; justify-content:flex-end; gap:10px;">
        <button id="edit-cancel-btn" class="btn btn-secondary">キャンセル</button>
        <button id="edit-save-btn" class="btn btn-primary">保存</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <!-- JSスクリプト (v23) -->
  <script src="app.js?v=23"></script>
</body>
</html>
