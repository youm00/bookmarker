<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Bookmarks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ログイン画面 -->
<div id="login-screen" class="login-screen">
  <div class="login-box">
    <h1>My Bookmarks</h1>
    <p class="login-sub">Supabaseアカウントでログイン</p>
    <input id="login-email" type="email" placeholder="メールアドレス" autocomplete="email">
    <input id="login-password" type="password" placeholder="パスワード" autocomplete="current-password">
    <button id="login-btn">ログイン</button>
    <p id="login-error" class="login-error"></p>
  </div>
</div>

<!-- メイン画面 -->
<div id="app" class="app hidden">

  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="brand">My Bookmarks</span>
      <button id="logout-btn" class="icon-btn" title="ログアウト">⏻</button>
    </div>
    <div class="tree-actions">
      <button id="new-root-folder-btn" class="text-btn">+ フォルダ</button>
    </div>
    <div id="tree" class="tree"></div>
  </aside>

  <main class="main">
    <div class="toolbar">
      <div class="breadcrumb" id="breadcrumb"></div>
      <input id="search-input" type="search" placeholder="検索(タイトル・URL・タグ)" class="search-input">
      <div class="toolbar-actions">
        <button id="add-bookmark-btn" class="text-btn primary">+ ブックマーク</button>
        <button id="import-btn" class="text-btn">インポート</button>
        <input id="import-file" type="file" accept=".html" class="hidden">
        <button id="export-btn" class="text-btn">エクスポート</button>
        <button id="settings-btn" class="icon-btn" title="表示設定">Aa</button>
      </div>
    </div>

    <div id="settings-panel" class="settings-panel hidden">
      <label>
        文字サイズ
        <input id="font-size-range" type="range" min="12" max="22" value="15">
        <span id="font-size-value">15px</span>
      </label>
      <label>
        行間
        <input id="line-height-range" type="range" min="120" max="220" step="10" value="160">
        <span id="line-height-value">1.6</span>
      </label>
      <label class="checkbox-row">
        <input id="dark-mode-toggle" type="checkbox">
        ダークモード
      </label>
    </div>

    <div id="list" class="list"></div>
  </main>

</div>

<!-- 追加/編集モーダル -->
<div id="edit-modal" class="modal hidden">
  <div class="modal-box">
    <h2 id="edit-modal-title">ブックマークを追加</h2>
    <input type="hidden" id="edit-id">
    <input type="hidden" id="edit-type">
    <label>タイトル<input id="edit-title" type="text"></label>
    <label id="edit-url-row">URL<input id="edit-url" type="text" placeholder="https://"></label>
    <label>タグ(カンマ区切り)<input id="edit-tags" type="text" placeholder="仕事, あとで読む"></label>
    <label>メモ<textarea id="edit-memo" rows="3"></textarea></label>
    <div class="modal-actions">
      <button id="edit-cancel-btn" class="text-btn">キャンセル</button>
      <button id="edit-save-btn" class="text-btn primary">保存</button>
    </div>
  </div>
</div>

<div id="toast" class="toast hidden"></div>

<script src="app.js"></script>
</body>
</html>
